<script>
const authScreen = document.getElementById('authScreen');
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const authMessage = document.getElementById('authMessage');
const logoutBtn = document.getElementById('logoutBtn');

const AUTH_STORAGE_KEY = 'cricket_academy_auth_session';

function getStoredSession(){
  try {
    return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
  } catch(e) {
    localStorage.removeItem(AUTH_STORAGE_KEY);
    return null;
  }
}

function clearStoredSession(){
  localStorage.removeItem(AUTH_STORAGE_KEY);
}

async function authRequest(path, options = {}){
  const headers = {
    'apikey': window.SUPABASE_PUBLISHABLE_KEY,
    'Content-Type': 'application/json',
    ...(options.headers || {})
  };

  const response = await fetch(
    `${window.SUPABASE_URL}${path}`,
    {
      ...options,
      headers
    }
  );

  let body = null;

  try {
    body = await response.json();
  } catch(e) {}

  if(!response.ok){
    throw new Error(
      body?.msg ||
      body?.message ||
      body?.error_description ||
      body?.error ||
      `Authentication request failed (${response.status})`
    );
  }

  return body;
}

async function signInWithPassword(email, password){

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){
    throw new Error(
      error.message || 'Unable to sign in.'
    );
  }

  const session = data.session;

  if(!session){
    throw new Error(
      'Login succeeded but no session was returned.'
    );
  }

  localStorage.setItem(
    AUTH_STORAGE_KEY,
    JSON.stringify(session)
  );

  return session;
}

async function signOutUser(){
  const session = getStoredSession();

  if(session?.access_token){
    try {
      await authRequest(
        '/auth/v1/logout',
        {
          method: 'POST',
          headers: {
            'Authorization':
              `Bearer ${session.access_token}`
          }
        }
      );
    } catch(e) {
      console.warn(
        'Supabase logout request failed; clearing local session.',
        e
      );
    }
  }

  clearStoredSession();
}

async function loadAuthenticatedUser(session){

  if(!session?.access_token || !session?.user?.id){
    clearStoredSession();
    showLogin(
      'Your login session is invalid. Please sign in again.'
    );
    return false;
  }

  const params = new URLSearchParams({
    select: 'id,full_name,email,role,is_active',
    id: `eq.${session.user.id}`,
    limit: '1'
  });

  try {

    const response = await fetch(
      `${window.SUPABASE_URL}/rest/v1/profiles?${params.toString()}`,
      {
        method: 'GET',
        headers: {
          'apikey': window.SUPABASE_PUBLISHABLE_KEY,
          'Authorization':
            `Bearer ${session.access_token}`,
          'Accept': 'application/json'
        }
      }
    );

    let body = null;

    try {
      body = await response.json();
    } catch(e) {}

    if(!response.ok){
      throw new Error(
        body?.message ||
        body?.hint ||
        body?.details ||
        `Profile request failed (${response.status})`
      );
    }

    const profile = body?.[0];

    if(!profile){
      await signOutUser();
      showLogin(
        'Your account profile was not found.'
      );
      return false;
    }

    if(profile.is_active === false){
      await signOutUser();
      showLogin(
        'Your account is inactive. Please contact the administrator.'
      );
      return false;
    }

    window.currentUser = profile;

    authScreen.style.display = 'none';
    logoutBtn.style.display = 'block';

    console.log(
      'Authenticated user:',
      profile
    );

    return true;

  } catch(error) {

    clearStoredSession();

    showLogin(
      error.message ||
      'Unable to load your account profile.'
    );

    return false;
  }
}

async function checkAuthSession(){

  const session = getStoredSession();

  if(
    session &&
    await loadAuthenticatedUser(session)
  ){
    return;
  }

  showLogin();
}

function showLogin(message = ''){

  authScreen.style.display = 'flex';

  logoutBtn.style.display = 'none';

  authMessage.textContent = message;
}

loginForm.addEventListener(
  'submit',
  async function(e){

    e.preventDefault();

    const email =
      document.getElementById('loginEmail')
      .value
      .trim();

    const password =
      document.getElementById('loginPassword')
      .value;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing In...';
    authMessage.textContent = '';

    try {

      const session = await Promise.race([

        signInWithPassword(
          email,
          password
        ),

        new Promise((_, reject) =>
          setTimeout(
            () => reject(
              new Error(
                'Login request timed out. Please check the Supabase connection.'
              )
            ),
            10000
          )
        )

      ]);

      await loadAuthenticatedUser(session);

    } catch(error) {

      clearStoredSession();

      authMessage.textContent =
        error.message ||
        'Unable to sign in.';

    } finally {

      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';

    }
  }
);

logoutBtn.addEventListener(
  'click',
  async function(){

    await signOutUser();

    window.currentUser = null;

    showLogin();
  }
);

checkAuthSession();
     </script>
</body>
</html>
